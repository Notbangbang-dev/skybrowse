<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>SkyBrowse — New Tab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23141b3d'/%3E%3Cstop%20offset='1'%20stop-color='%2333295e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='256'%20height='256'%20rx='56'%20fill='url(%23g)'/%3E%3Cpath%20d='M40%20136%20L220%2040%20L146%20220%20L114%20146%20Z'%20fill='%23f4f6ff'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0b1026;
            --panel: rgba(20, 27, 61, 0.55);
            --text: #e8ecf8;
            --muted: #8a93b8;
            --accent: #8b7cf6;
            --accent-strong: #6d5df1;
            --border: rgba(255, 255, 255, 0.09);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
        }

        .aurora-a {
            top: -25%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(109, 93, 241, 0.35), transparent 65%);
        }

        .aurora-b {
            bottom: -30%;
            right: -15%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(64, 132, 255, 0.28), transparent 65%);
        }

        .corner-mark {
            position: fixed;
            top: 26px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
        }

        .corner-mark span {
            font-size: 13px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            color: var(--muted);
        }

        main {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: min(720px, 92vw);
            text-align: center;
        }

        .clock {
            font-size: clamp(64px, 11vw, 96px);
            font-weight: 250;
            letter-spacing: -3px;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #ffffff 20%, #a9b0e4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.05;
        }

        .date {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 34px;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            height: 54px;
            padding: 0 22px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 27px;
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search:focus-within {
            border-color: var(--accent-strong);
            box-shadow: 0 0 0 4px rgba(139, 124, 246, 0.16), 0 18px 50px rgba(0, 0, 0, 0.45);
        }

        .search svg { flex: 0 0 auto; opacity: 0.75; }

        .search input {
            flex: 1;
            min-width: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 16px;
        }

        .search input::placeholder { color: #6f7896; }

        .dials {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 40px;
        }

        .dial {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 84px;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            transition: transform 0.18s ease, color 0.18s ease;
        }

        .dial:hover { transform: translateY(-3px); color: var(--text); }

        .dial-tile {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>

    <div class="corner-mark">
        <svg width="26" height="26" viewBox="0 0 256 256" aria-hidden="true">
            <defs>
                <linearGradient id="mark-bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#141b3d"/>
                    <stop offset="1" stop-color="#33295e"/>
                </linearGradient>
            </defs>
            <rect width="256" height="256" rx="56" fill="url(#mark-bg)"/>
            <path d="M40 136 L220 40 L146 220 L114 146 Z" fill="#f4f6ff"/>
        </svg>
        <span>SkyBrowse</span>
    </div>

    <main>
        <h1 class="clock" id="clock">00:00</h1>
        <p class="date" id="date">&nbsp;</p>

        <form class="search" id="searchForm" action="https://www.google.com/search" method="get" role="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9cdf2" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M21 21l-4.3-4.3"/>
            </svg>
            <input id="searchInput" name="q" type="text" placeholder="Search the web or type a URL" autocomplete="off" spellcheck="false" autofocus>
        </form>

        <nav class="dials" aria-label="Shortcuts">
            <a class="dial" href="https://www.youtube.com" aria-label="YouTube"><span class="dial-tile"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="#FF0033" d="M21.6 7.2a2.8 2.8 0 0 0-2-1.98C17.9 4.85 12 4.85 12 4.85s-5.9 0-7.6.37A2.8 2.8 0 0 0 2.4 7.2 29.3 29.3 0 0 0 2 12a29.3 29.3 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 1.98c1.7.37 7.6.37 7.6.37s5.9 0 7.6-.37a2.8 2.8 0 0 0 2-1.98A29.3 29.3 0 0 0 22 12a29.3 29.3 0 0 0-.4-4.8z"/><path fill="#ffffff" d="M10.4 15.35v-6.7l5.75 3.35-5.75 3.35z"/></svg></span>YouTube</a>
            <a class="dial" href="https://github.com" aria-label="GitHub"><span class="dial-tile"><svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true" fill="#e8ecf8"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.111.82-.261.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .319.21.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12z"/></svg></span>GitHub</a>
            <a class="dial" href="https://www.reddit.com" aria-label="Reddit"><span class="dial-tile"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><ellipse cx="12" cy="15.2" rx="7.6" ry="6.4" fill="#FF4500"/><circle cx="4.2" cy="13.2" r="1.7" fill="#FF4500"/><circle cx="19.8" cy="13.2" r="1.7" fill="#FF4500"/><path d="M12.4 9.2L15.4 4.6" stroke="#FF4500" stroke-width="1.6" stroke-linecap="round"/><circle cx="16.2" cy="3.6" r="1.4" fill="#FF4500"/><circle cx="9.4" cy="14.6" r="1.25" fill="#12142a"/><circle cx="14.6" cy="14.6" r="1.25" fill="#12142a"/><path d="M9.6 17.7c1.6 1.3 3.2 1.9 4.4 1.9s2.9-.7 4.4-1.9" fill="none" stroke="#12142a" stroke-width="1.4" stroke-linecap="round"/></svg></span>Reddit</a>
            <a class="dial" href="https://www.wikipedia.org" aria-label="Wikipedia"><span class="dial-tile"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><text x="12" y="18.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#e8ecf8">W</text></svg></span>Wikipedia</a>
            <a class="dial" href="https://www.twitch.tv" aria-label="Twitch"><span class="dial-tile"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#A970FF" d="M5 3.2L3.4 7.6v11.6a1.4 1.4 0 0 0 1.4 1.4h3.2v-3.8h3.2l1.7 3.8h3l1.7-3.8h4c.8 0 1.4-.6 1.4-1.4V3.2z"/><rect x="10.4" y="8.8" width="2" height="5" rx="0.4" fill="#12142a"/><rect x="15" y="8.8" width="2" height="5" rx="0.4" fill="#12142a"/></svg></span>Twitch</a>
            <a class="dial" href="https://maps.google.com" aria-label="Google Maps"><span class="dial-tile"><svg viewBox="0 0 24 24" width="27" height="27" aria-hidden="true"><path fill="#EA4335" d="M12 2.6a7.1 7.1 0 0 0-7.1 7.1c0 5.3 7.1 11.7 7.1 11.7s7.1-6.4 7.1-11.7A7.1 7.1 0 0 0 12 2.6z"/><circle cx="12" cy="9.8" r="2.7" fill="#12142a"/></svg></span>Maps</a>
            <a class="dial" href="https://www.x.com" aria-label="X"><span class="dial-tile"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="#e8ecf8" d="M4 3.5h3.9l5.5 7.7 6-7.7h2.9l-7.4 9.4 7.4 9.6h-3.9l-5.7-8-6.4 8H4l7.8-9.9L4 3.5z"/></svg></span>X</a>
        </nav>
    </main>

    <script src="newtab.js"></script>
</body>
</html>
