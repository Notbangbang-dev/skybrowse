<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Settings — SkyBrowse</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20256%20256'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23141b3d'/%3E%3Cstop%20offset='1'%20stop-color='%2333295e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='256'%20height='256'%20rx='56'%20fill='url(%23g)'/%3E%3Cpath%20d='M40%20136%20L220%2040%20L146%20220%20L114%20146%20Z'%20fill='%23f4f6ff'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0b1026;
            --panel: rgba(20, 27, 61, 0.55);
            --text: #e8ecf8;
            --muted: #8a93b8;
            --accent: #8b7cf6;
            --accent-strong: #6d5df1;
            --border: rgba(255, 255, 255, 0.09);
            --ok: #6ee7b7;
            --err: #fca5a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse 70% 50% at 10% -10%, rgba(109, 93, 241, 0.22), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            padding: 44px 24px 60px;
        }

        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        .crumb {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 30px;
            letter-spacing: -0.5px;
            margin-bottom: 26px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            padding: 6px 22px;
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 17px 0;
            border-bottom: 1px solid var(--border);
        }

        .row:last-child { border-bottom: 0; }

        .row h2 {
            font-size: 13.5px;
            font-weight: 600;
        }

        .row p {
            color: var(--muted);
            font-size: 11.5px;
            margin-top: 3px;
            max-width: 380px;
        }

        select, input[type="text"] {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #171d38;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            min-width: 190px;
        }

        input[type="text"] { flex: 1; min-width: 0; }

        select:focus-visible, input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .homepage-row { flex-direction: column; align-items: stretch; }

        .homepage-form { display: flex; gap: 8px; margin-top: 10px; }

        button.save {
            padding: 9px 18px;
            border: 0;
            border-radius: 9px;
            background: var(--accent-strong);
            color: #fff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        button.save:hover { filter: brightness(1.15); }

        .status {
            min-height: 20px;
            font-size: 12px;
            color: var(--muted);
            margin: 2px 2px 0;
        }

        .status.ok { color: var(--ok); }
        .status.err { color: var(--err); }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #5f6788;
            font-size: 11.5px;
            padding: 4px 2px;
        }

        .foot a { color: var(--accent); text-decoration: none; }
        .foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="crumb">SkyBrowse · skybrowse://settings</p>
        <h1>Settings</h1>

        <div class="card" aria-label="Search and startup">
            <div class="row">
                <div>
                    <h2>Default search engine</h2>
                    <p>Used in the address bar and the New Tab page.</p>
                </div>
                <select id="searchEngine" aria-label="Default search engine">
                    <option value="google">Google</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div class="row">
                <div>
                    <h2>Startup page</h2>
                    <p>What opens when SkyBrowse launches.</p>
                </div>
                <select id="startupPage" aria-label="Startup page">
                    <option value="newtab">New Tab page</option>
                    <option value="homepage">My homepage</option>
                </select>
            </div>

            <div class="row homepage-row">
                <div>
                    <h2>Homepage</h2>
                    <p>The page the Home button opens. Use <code>skybrowse://newtab</code> or any https:// URL.</p>
                </div>
                <form class="homepage-form" id="homepageForm">
                    <input id="homepage" type="text" spellcheck="false" autocomplete="off" placeholder="skybrowse://newtab" aria-label="Homepage URL">
                    <button class="save" type="submit">Save</button>
                </form>
            </div>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="foot" style="gap: 14px">
            <span id="version">SkyBrowse</span>
            <a href="skybrowse://history">History</a>
            <a href="skybrowse://downloads">Downloads</a>
            <a href="skybrowse://about">About SkyBrowse →</a>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
